name: Build Debug APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test & Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The Android Gradle plugin signs debug builds with debug.keystore here.
      ANDROID_USER_HOME: /home/runner/.android

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Reuse one debug signing key across runs so a new APK installs over the
      # previous one instead of failing with "App not installed". The first run
      # without a cached key generates it; later runs restore the same file.
      - name: Restore Debug Signing Key
        id: debug-key
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_USER_HOME }}/debug.keystore
          key: reels-wait-debug-keystore-v1

      - name: Create Debug Signing Key
        if: steps.debug-key.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$ANDROID_USER_HOME"
          keytool -genkeypair -v -keystore "$ANDROID_USER_HOME/debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: reels-wait-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Test Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
